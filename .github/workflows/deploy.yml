name: Deploy backend

# Сборка образа в CI и публикация в Docker Hub, затем сервер по SSH тянет образ
# и поднимает его через Docker. Код «запечён» в образ — заливать исходники на
# сервер не нужно.
#
# Требуются секреты репозитория (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — логин Docker Hub (напр. alexhcjp)
#   DOCKERHUB_TOKEN    — access token Docker Hub (Account Settings → Security)
#   SSH_HOST           — адрес сервера, напр. 213.155.23.198
#   SSH_USERNAME       — пользователь SSH
#   SSH_PASSWORD       — пароль пользователя SSH
#   SSH_PORT           — порт SSH (необязательно, по умолчанию 22)
#   PROJECT_PATH       — путь к каталогу проекта на сервере (где docker-compose.yml)
#   FIREBASE_SERVICE_ACCOUNT_B64 — service-account.json Firebase в base64 (одной строкой)
#
# На сервере должны быть: Docker + Docker Compose v2 и рабочий .env в PROJECT_PATH.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: alexhcjp/megaladon_back

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync compose & nginx config to server
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }}" \
            docker-compose.yml docker \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_PATH }}/"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        with:
          envs: FIREBASE_SA_B64
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd "${{ secrets.PROJECT_PATH }}"

            echo "==> Логинимся в Docker Hub (приватный образ)"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Внешняя сеть, через которую Caddy (стек manover-edge) отдаёт
            # сюда трафик api.manovermetal.kz. Создаём идемпотентно: без неё
            # compose не поднимется вовсе.
            echo "==> Проверяем сеть manover_edge"
            docker network inspect manover_edge >/dev/null 2>&1 \
              || docker network create manover_edge

            export APP_IMAGE="alexhcjp/megaladon_back:${{ github.sha }}"

            echo "==> Тянем образ и поднимаем контейнеры (ждём healthcheck БД)"
            docker compose pull
            docker compose up -d --no-build --remove-orphans --wait

            # Ключ сервис-аккаунта Firebase лежит под storage/app/, где
            # .gitignore игнорирует всё, поэтому в репозиторий и в образ он не
            # попадает: entrypoint копировать нечего, каталога в томе не
            # возникает, и FCM падает с "Invalid service account". Кладём из
            # секрета на каждом деплое — том app_storage переживает
            # пересоздание контейнера, но не пересоздание самого тома.
            echo "==> Кладём ключ Firebase в storage"
            if [ -z "${FIREBASE_SA_B64:-}" ]; then
              echo "Секрет FIREBASE_SERVICE_ACCOUNT_B64 не задан — пуши не заработают" >&2
              exit 1
            fi
            docker compose exec -T app sh -c 'mkdir -p /var/www/storage/app/firebase'
            echo "$FIREBASE_SA_B64" | base64 -d \
              | docker compose exec -T app sh -c 'cat > /var/www/storage/app/firebase/service-account.json'
            docker compose exec -T app sh -c 'chown www-data:www-data /var/www/storage/app/firebase/service-account.json \
              && chmod 600 /var/www/storage/app/firebase/service-account.json'
            # Пустой файл означает, что секрет содержит не тот base64 — лучше
            # уронить деплой здесь, чем молча остаться без пушей.
            docker compose exec -T app sh -c 'test -s /var/www/storage/app/firebase/service-account.json' \
              || { echo "ключ не записался" >&2; exit 1; }

            # default.conf смонтирован в контейнер файлом, а тег образа nginx
            # фиксированный — если поменялся только конфиг, compose разницы в
            # сервисе не видит и контейнер не пересоздаёт. Правки так и не
            # применились бы. Перечитываем конфиг явно, но лишь после проверки:
            # reload с битым конфигом оставит nginx на старом, а restart —
            # уронит его совсем.
            echo "==> Применяем конфиг nginx"
            if docker compose exec -T nginx nginx -t; then
              docker compose exec -T nginx nginx -s reload
            else
              echo "Конфиг nginx не прошёл проверку — оставляю работать старый" >&2
              exit 1
            fi

            echo "==> Гарантируем наличие БД перед миграциями"
            docker compose exec -T db sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`$MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"'

            echo "==> Миграции и кеши"
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan storage:link || true
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan view:cache

            echo "==> Чистим неиспользуемые образы"
            docker image prune -f

            echo "==> Готово"
