# Стенд для сквозных тестов приложения (megaladon_app/test_e2e/run.sh):
# бэкенд из текущего кода + чистая MySQL в памяти. С рабочим стеком не
# пересекается: свой project name, без container_name, порт 18080.
# Access-токен живёт 3 секунды, чтобы истечение было настоящим.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: e2e
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e
      MYSQL_ROOT_PASSWORD: e2e
    tmpfs: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      retries: 60

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Код из образа (/app), без entrypoint с rsync в /var/www.
    entrypoint: ""
    working_dir: /app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:ZTJlZTJlZTJlZTJlZTJlZTJlZTJlZTJlZTJlZTJlZTI=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: e2e
      DB_USERNAME: e2e
      DB_PASSWORD: e2e
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      SANCTUM_ACCESS_TTL: 3
      # Несколько воркеров: параллельные запросы клиента и правда параллельны.
      PHP_CLI_SERVER_WORKERS: 8
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --class=CitySeeder --force &&
             php artisan db:seed --class=DemoSeeder --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "18080:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/order >/dev/null"]
      interval: 2s
      retries: 90
